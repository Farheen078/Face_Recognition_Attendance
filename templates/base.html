<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Smart Attendance{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Smart Attendance System</div>
        <div class="nav-links">
            {% if session.admin_id and request.endpoint != 'login' and request.endpoint != 'index' %}
                <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
                <a href="{{ url_for('manage_students') }}">Students</a>
                <a href="{{ url_for('reports') }}">Reports</a>
                <a href="{{ url_for('logout') }}">Logout</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>© 2026 Smart Attendance System | BCA 6th Semester Project</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
